spring:
  application:
    name: fleetpulse-backend
  datasource:
    url: ${FP_DB_URL:jdbc:mysql://localhost:3306/fleetpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${FP_DB_USER}
    password: ${FP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${FP_SMTP_HOST:}
    port: ${FP_SMTP_PORT:587}
    username: ${FP_SMTP_USER:}
    password: ${FP_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: ${FP_PORT:8080}
  forward-headers-strategy: framework

fleetpulse:
  jwt:
    secret: ${FP_JWT_SECRET}            # min 32 bytes, base64 or plain text
    access-ttl-minutes: ${FP_JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${FP_JWT_REFRESH_TTL_DAYS:14}
    issuer: fleetpulse
  cors:
    allowed-origins: ${FP_CORS_ORIGINS:http://localhost:5173,http://localhost:1420,tauri://localhost,http://tauri.localhost}
  superadmin:
    # Plaintext is used ONCE to create the BCrypt hash when no platform admin exists. The DB only stores the hash.
    bootstrap-password: ${FP_SUPERADMIN_BOOTSTRAP_PASSWORD:}
    max-failed-attempts: 5
    lockout-minutes: 15
    session-ttl-minutes: 60
  otp:
    ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    dev-bypass: ${FP_OTP_DEV_BYPASS:false}
  email:
    from: ${FP_MAIL_FROM:no-reply@fleetpulse.local}
    enabled: ${FP_EMAIL_ENABLED:false}
  sms:
    # provider: twilio (REST). Leave disabled until credentials are configured.
    enabled: ${FP_SMS_ENABLED:false}
    twilio-account-sid: ${FP_TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${FP_TWILIO_AUTH_TOKEN:}
    twilio-from: ${FP_TWILIO_FROM:}
  rate-limit:
    public-per-minute: 60
    auth-per-minute: 10
  trial-days: 14
  public-url: ${FP_PUBLIC_URL:http://localhost:5173}
  storage:
    type: ${FP_STORAGE_TYPE:local}          # local (dev) or s3 (any S3-compatible service)
    local-dir: ${FP_STORAGE_DIR:./data/files}
    s3-endpoint: ${FP_S3_ENDPOINT:}
    s3-region: ${FP_S3_REGION:auto}
    s3-bucket: ${FP_S3_BUCKET:}
    s3-access-key: ${FP_S3_ACCESS_KEY:}
    s3-secret-key: ${FP_S3_SECRET_KEY:}
  routing:
    base-url: ${FP_ORS_BASE_URL:https://api.openrouteservice.org}
    api-key: ${FP_ORS_API_KEY:}
  billing:
    stripe-secret-key: ${FP_STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${FP_STRIPE_WEBHOOK_SECRET:}
  whatsapp:
    token: ${FP_WHATSAPP_TOKEN:}
    phone-number-id: ${FP_WHATSAPP_PHONE_ID:}
    template-out-for-delivery: ${FP_WHATSAPP_TEMPLATE_OFD:}
    template-delivered: ${FP_WHATSAPP_TEMPLATE_DELIVERED:}
    template-language: ${FP_WHATSAPP_LANG:en}
  ai:
    # NVIDIA NIM exposes an OpenAI-compatible API. The key is read from the environment only.
    api-key: ${FP_NVIDIA_API_KEY:}
    base-url: ${FP_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
    timeout-seconds: 60
    max-output-tokens: 900

springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
